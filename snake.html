<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="game" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

     
        const TILE = 20;    // размер одной клетки в пикселях

        const COLS = canvas.width / TILE; // 20 столбцов
        const ROWS = canvas.height / TILE;  // // 20 строк 

        // фон поля
        ctx.fillStyle = "#0a0a0a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let snake = [
            {x: 10, y: 10}, // голова
            {x: 9, y: 10}, // тело
            {x: 8, y: 10}, // хвост
        ];

        function drawSnake() {
            snake.forEach((seg, i) => {
                ctx.fillStyle = i === 0
                    ? '#4ade80'   // голова — ярче
                    : '#16a34a';  // тело — темнее
                ctx.fillRect(
                    seg.x * TILE + 1,
                    seg.y * TILE + 1,
                    TILE - 2,
                    TILE - 2

                );
            });
        }

        let dir = {x: 1, y: 0}; // начальное направление — вправо

        function move() {
            // 1. Новая голова = старая голова + направление
            const head = {
                x: snake[0].x + dir.x,
                y: snake[0].y + dir.y
            };
            // 2. Вставляем новую голову в начало
            snake.unshift(head);
            // 3. Удаляем хвост (пока нет роста)
            snake.pop();

        }

        function gameLoop() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);  // очистка
            move();
            drawSnake();
            drawFood();
            drawScore();

            if (gameOver) {
                ctx.fillStyle = '#f2071f';
                ctx.font = 'bold 24px italic';
                ctx.textAlign = 'center';
                ctx.fillText("Game Over!", canvas.width / 2, canvas.heihgt / 2);
                ctx.font = '14px italic';
                ctx.fillStyle = 'ffffff';
                ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 30)
            }
            
        }

        setInterval(gameLoop, 150) // 150 мс = ~7 кадров/сек

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    if (dir.y !== 1) dir = {x: 0, y: -1};
                    break;
                case 'ArrowDown':
                    if (dir.y !== -1) dir = {x: 0, y: 1};
                    break;
                case 'ArrowLeft':
                    if (dir.x !== 1) dir = {x: -1, y: 0};
                    break;
                case 'ArrowRight':
                    if (dir.x !== -1) dir = {x: 1, y: 0};
                    break;
            }
        });

        function spawnFood() {
            return {
                x: Math.floor(Math.random() * COLS),
                y: Math.floor(Math.random() * ROWS)
            };
        }
        

        function checkCollision(head) {
            if (head.x < 0 || head.x >= COLS) return true;
            if (head.y < 0 || head.y >= ROWS) return true;

            return snake.some(seg => 
                seg.x === head.x && seg.y === head.y
            );

        }

        let food = spawnFood();

        function drawFood() {
            ctx.fillStyle = '#fc1c03';
            ctx.fillRect(
                food.x * TILE + 3,
                food.y * TILE + 3,
                TILE - 6, 
                TILE - 6

            );
        }

        let score = 0;
        let gameOver = false;


        function drawScore() {
            ctx.fillStyle = '#ffffff';
            ctx.font = '25px bald';
            ctx.fillText(`Score: ${score}`, 8, 18);
                
        }

        function move() {
            const head = {
                x: snake[0].x + dir.x, 
                y: snake[0].y + dir.y
            };
            
            if (checkCollision(head)) {
                gameOver = true;
                return;
                
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                food = spawnFood();

            } else {
                snake.pop();
            }

        }
    </script>
</body>
</html>
