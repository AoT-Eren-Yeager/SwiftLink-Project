<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftLink — Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="login-box">
        <h1>SwiftLink Chat</h1>
        <form id="registerForm">
        <div class="autocomplete-wrapper">
            <input type="text" name="login" id="loginInput" placeholder="Логин" autocomplete="off">
        </div>
        <div class="suggestions-list" id="suggestionsList">

        </div>
        <input type="password" name="password" placeholder="Пороль">
        <input type="password" name="password2" placeholder="Повтори пороль">
        <button type="submit">Зарегистрироваться</button>
        </form>
        <p>Если у вас есть аккаунт<a href="login.html" class="link-no-underline"> Войдите</a></p>
        
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = e.target.login.value;
            const password = e.target.password.value;
            const password2 = e.target.password2.value;

            if (password !== password2) {
                alert('Пароли не совпадают');
                return;
            }

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, password })
            });

            const data = await res.json();

            if (data.success) {
                window.location.href = '/login.html';
            } else {
                alert(data.error);
            }
        });
    </script>    
</body>
</html>
